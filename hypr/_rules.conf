##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = main-floating
    match:workspace = 1
    match:class = .*

    float = true
    center = true
    size = (monitor_w*0.9) (monitor_h*0.9)
}

#DISCORD
xwayland {
    force_zero_scaling = true
}

#KITTY
windowrule {
    name = kitty-window
    match:class=(kitty)
    
    opacity = 0.60
    workspace = special:kitty
}

#OPERA
windowrule {
    name = opera-window
    match:class = (Opera)

    workspace = 2
    float = false
    border_size = 1
}

windowrule {
    name = opera-open-files
    match:initial_title = ^(Open Files)$

    float = true
    center = true
    opacity = 0.85
    size = (monitor_w*0.5) (monitor_h*0.5)
}

#CODE
windowrule {
    name = code-window
    match:class = code

    workspace = 3
    float = false
}

# FLAMESHOT
windowrule {
    name = proper-flameshot-handling
    match:class = flameshot

    animation = fade
    rounding = 0
    border_size = 0
    fullscreen_state = 0 2
    float = on
    pin = on
    monitor = eDP-1
    move = 0 0
    size = (2560) (1600)
}

#YT-MUSIC
windowrule {
    name = yt-music
    match:class=(YouTube Music Desktop App)
    
    opacity = 0.75
    workspace = special:ytmusic
}

#HYPRLAND
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
