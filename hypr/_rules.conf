##############################
### LAYER RULES            ###
##############################

# Blur dunst notification popups so they match the general theme
layerrule {
    name = blur-notifications
    match:namespace = ^(notifications)$

    blur = true
    ignore_alpha = 0.6
}

# Blur behind Quickshell's notification banners and volume/brightness OSD, so their translucent
# fills get the same blur and noise as windows. The glow around them is fainter than
# ignore_alpha, so only the shapes themselves are blurred
layerrule {
    name = blur-quickshell-notifications
    match:namespace = ^(quickshell-(notifications|osd))$

    blur = true
    ignore_alpha = 0.4
}

# The same for the bar and its panels, and blur_popups for their tray menus and tooltips. Their
# fills are lighter (35%), so the cut-off is lower; the glow still stays under it
layerrule {
    name = blur-quickshell-bar
    match:namespace = ^(quickshell)$

    blur = true
    blur_popups = true
    ignore_alpha = 0.3
}

# The shell's app launcher, clipboard picker and overview, blurred like the bar. Their windows
# cover the screen to catch clicks outside the panel, so all but the panel is fainter than
# ignore_alpha; they animate themselves, so Hyprland's layer fade is off
layerrule {
    name = quickshell-launcher
    match:namespace = ^(quickshell-(launcher|clipboard|overview))$

    blur = true
    ignore_alpha = 0.3
    no_anim = true
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = main-floating
    match:workspace = 1
    match:class = .*

    float = true
    center = true
    size = (monitor_w*0.9) (monitor_h*0.9)
}

#DISCORD
xwayland {
    force_zero_scaling = true
}

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

#KITTY
windowrule {
    name = kitty-window
    match:class=(kitty)

    opacity = 0.60
    workspace = special:kitty
}

#OPERA
windowrule {
    name = opera-window
    match:class = (Opera)

    workspace = 2
    float = false
}

#FIREFOX DEVELOPER EDITION
windowrule {
    name = firefox-window
    match:class = (firefox-developer-edition)

    workspace = 2
    float = false
}

#TELEGRAM
windowrule {
    name = telegram-window
    match:class = ^(org.telegram.desktop|TelegramDesktop|telegram-desktop)$

    suppress_event = activate
    workspace = 5
    float = false
}

#CODE
windowrule {
    name = code-window
    match:class = ^(code|com\.microsoft\.VSCode)$

    workspace = 3
    float = false
}

#PLAYWRIGHT
# Matched by title: its class comes from the launching app's CHROME_DESKTOP (com.microsoft.VSCode under VS Code).
# Must stay below code-window so it overrides that rule's workspace.
windowrule {
    name = playwright-window
    match:initial_title = (.* - )?Google Chrome for Testing

    suppress_event = activate
    workspace = 6 silent
    float = false
}

# FLAMESHOT
windowrule {
    name = proper-flameshot-handling
    match:class = flameshot

    no_anim = true
    rounding = 0
    border_size = 0
    fullscreen_state = 0 0
    float = on
    pin = on
    monitor = eDP-1
    move = 0 0
    size = (monitor_w) (monitor_h)
}

#RIDER
windowrule {
    name = rider
    match:class=(jetbrains-rider)

    no_anim = true
    workspace = 4
}

windowrule {
    name = rider-floating
    match:class=(jetbrains-rider)
    match:float=true

    workspace = 4
    center = true
    size = (window_w) 700
}

windowrule {
    name = rider-floating-merge
    match:class=(jetbrains-rider)
    match:title=^(Merge Revisions)
    match:float=true

    no_anim = true
    workspace = 4
    center = true
    size = (window_w) (window_h*1.15)
}

windowrule {
    name = rider-welcome
    match:class=(jetbrains-rider)
    match:title=(Welcome to JetBrains Rider)

    float = true
    workspace = 4
    center = true
    size = (monitor_w*0.25) (monitor_h*0.35)
}

windowrule {
    name = rider-settings
    match:class=(jetbrains-rider)
    match:title=(Settings)

    float = true
    workspace = 4
    center = true
    size = (monitor_w*0.25) (monitor_h*0.35)
}

windowrule {
    name = ark-rules
    match:class =^(org.kde.ark)$
    float = true
    size = (monitor_w*0.5) (monitor_h*0.5)
    center = true
}

windowrule {
    name = dota2
    match:class = ^(dota2)$

    float = false
}

#DIALOGS
# File pickers float in the middle at a comfortable size instead of tiling full size, whichever
# app opens them: the portal's own window (most apps), or an app's own dialog by its title
# (Opera's "Open Files"). Below the app rules so it wins over their float = false
windowrule {
    name = file-dialogs
    match:class = ^(xdg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.kde)$

    float = true
    center = true
    opacity = 0.85
    size = (monitor_w*0.55) (monitor_h*0.65)
}

windowrule {
    name = file-dialog-titles
    match:initial_title = ^(Open|Open Files?|Open Folder|Save|Save File|Save As.*|Save Image.*|Choose Files?|Select (a )?(File|Folder|Directory)|File Upload|Upload Files?)$

    float = true
    center = true
    opacity = 0.85
    size = (monitor_w*0.55) (monitor_h*0.65)
}

#HYPRLAND
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}