##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = kitty-window
    match:class=(kitty)

    opacity = 0.60
}

windowrule {
    name = proper-flameshot-handling
    match:class = flameshot

    animation = fade
    rounding = 0
    border_size = 0
    fullscreen_state = 3 3
    float = on
    pin = on
    monitor = eDP-1
    move = 0 0
    size = (2560) (1600)
}

windowrule {
    name = suppress-maximize-events
    match:class = .*

    float = true
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}