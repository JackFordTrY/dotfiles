##########################
### CUSTOM KEYBINDINGS ###
##########################

# Everything on mainMod (SUPER), kept in gaming mode too
source = ~/.config/hypr/_bindings_super.conf

bind = , F1, layoutmsg, swapwithmaster

bind = CONTROL, Q, togglespecialworkspace, kitty

bind = , Print, exec, QT_SCALE_FACTOR="0.8" flameshot gui

# Windows ALT+TAB: through the tabs when the active window is in a group, else the workspace's windows.
# `test` rather than `[`, which exec would take for its [rules] prefix
bindel = ALT, TAB, exec, test "$(hyprctl activewindow -j | jq '.grouped | length')" -gt 1 && hyprctl dispatch changegroupactive f || hyprctl dispatch cyclenext

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && qs ipc call osd volume
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && qs ipc call osd volume
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && qs ipc call osd volume
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && qs ipc call osd mic
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s +5% && qs ipc call osd brightness
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%- && qs ipc call osd brightness

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = , F4, exec, $terminal

###################
### GAMING MODE ###
###################
# Enter the gaming submap. While active, ALL global keybinds are blocked
# except the SUPER ($mainMod) binds sourced below, so games receive
# every other key directly. Exit with the same combo.
bind = $mainMod ALT, G, exec, notify-send -a Hyprland -i input-gaming -t 3000 "Gaming mode on" "Only SUPER binds are active"
bind = $mainMod ALT, G, submap, gaming

submap = gaming

bind = , Print, exec, QT_SCALE_FACTOR="0.8" flameshot gui

# --- exit the submap ---
bind = $mainMod ALT, G, exec, notify-send -a Hyprland -i input-gaming -t 3000 "Gaming mode off" "All keybinds are back"
bind = $mainMod ALT, G, submap, reset

# --- SUPER binds kept active (the same file as above) ---
source = ~/.config/hypr/_bindings_super.conf

submap = reset
